apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobbies-api
spec:
  selector:
    matchLabels:
      app: lobbies-api
  template:
    metadata:
      labels:
        app: lobbies-api
    spec:
      containers:
        - name: server
          image: lobbies-api
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          env:
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
              value: "false"
            - name: GAMES_HOST
              value: "http://games-api:50051"
            - name: HOST_PREFIX
              value: "/api/lobbies"
            - name: PLAYERS_HOST
              value: "http://players-api"
            - name: REDIS_HOST
              value: "lobbies-db-valkey-master"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lobbies-db-valkey
                  key: valkey-password
---
apiVersion: v1
kind: Service
metadata:
  name: lobbies-api
spec:
  selector:
    app: lobbies-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lobbies-api-route
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/lobbies/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: lobbies-api
          port: 80
