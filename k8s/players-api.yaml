apiVersion: apps/v1
kind: Deployment
metadata:
  name: players-api
spec:
  selector:
    matchLabels:
      app: players-api
  template:
    metadata:
      labels:
        app: players-api
    spec:
      containers:
        - name: server
          image: players-api
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          env:
            - name: HOST_PREFIX
              value: "/api/players"
            - name: REDIS_HOST
              value: "players-db-valkey-master"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: players-db-valkey
                  key: valkey-password
---
apiVersion: v1
kind: Service
metadata:
  name: players-api
spec:
  selector:
    app: players-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: players-api-route
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/players/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: players-api
          port: 80
