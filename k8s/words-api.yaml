apiVersion: apps/v1
kind: Deployment
metadata:
  name: words-api
spec:
  selector:
    matchLabels:
      app: words-api
  template:
    metadata:
      labels:
        app: words-api
    spec:
      containers:
        - name: server
          image: words-api
          ports:
            - containerPort: 50051
          livenessProbe:
            grpc:
              port: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: words-api
spec:
  type: ClusterIP
  selector:
    app: words-api
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
