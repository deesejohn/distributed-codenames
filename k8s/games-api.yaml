apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-api
spec:
  selector:
    matchLabels:
      app: games-api
  template:
    metadata:
      labels:
        app: games-api
    spec:
      containers:
        - name: server
          image: games-api
          ports:
            - containerPort: 50051
          livenessProbe:
            grpc:
              port: 50051
          env:
            - name: NATS_HOST
              value: "nats"
            - name: REDIS_HOST
              value: "games-db-valkey-master"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: games-db-valkey
                  key: valkey-password
            - name: WORDS_ADDRESS
              value: "words-api:50051"
---
apiVersion: v1
kind: Service
metadata:
  name: games-api
spec:
  type: ClusterIP
  selector:
    app: games-api
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
